<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design System Iteration 2 — Progress</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e2e2e5;
    --text: #1c1d1f;
    --muted: #6b6b70;
    --done-bg: #e6f6ec;
    --done-fg: #1a7f4a;
    --progress-bg: #fff6e0;
    --progress-fg: #92650a;
    --todo-bg: #f0f0f2;
    --todo-fg: #6b6b70;
    --accent: #4a90d9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #201f22;
      --border: #34343a;
      --text: #ededed;
      --muted: #9a9aa2;
      --done-bg: #113321;
      --done-fg: #6bd99a;
      --progress-bg: #332a10;
      --progress-fg: #e0b84a;
      --todo-bg: #262629;
      --todo-fg: #9a9aa2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 2.5rem;
    padding-inline: 1rem;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 640px; margin-inline: auto; }
  h1 { font-size: 1.3rem; margin: 0 0 0.25rem; }
  .subtitle { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.9rem; }
  .progress-wrap {
    background: var(--todo-bg);
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 0.5rem;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }
  .progress-label {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 2rem;
  }
  .track-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 1.75rem 0 0.5rem;
  }
  .track-label:first-of-type { margin-top: 0; }
  ol { list-style: none; margin: 0; padding: 0; }
  li {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
  }
  .task-id {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 0.85rem;
    min-width: 2.2rem;
  }
  .task-body { flex: 1; min-width: 0; }
  .task-name { font-weight: 600; }
  .task-detail {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.15rem;
  }
  .task-detail code {
    background: var(--todo-bg);
    padding: 0.05rem 0.35rem;
    border-radius: 4px;
    font-size: 0.8em;
  }
  .status {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status.done { background: var(--done-bg); color: var(--done-fg); }
  .status.progress { background: var(--progress-bg); color: var(--progress-fg); }
  .status.todo { background: var(--todo-bg); color: var(--todo-fg); }
  footer {
    margin-top: 2rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>Design System Iteration 2</h1>
  <p class="subtitle">Progress on <code>docs/superpowers/plans/2026-09-20-design-system-iteration-2.md</code></p>

  <div class="progress-wrap"><div class="progress-bar" style="width: 77%"></div></div>
  <p class="progress-label">10 of 13 done · 1 in progress · 2 not started</p>

  <ol id="tasks"></ol>

  <footer>Static snapshot — regenerated by hand whenever a task's status changes, not live.</footer>
</main>

<script>
  const tasks = [
    { id: "1",  name: "Seed-color tonal ramp generator", status: "done", detail: "<code>ecfc7ef</code> · 23/23 tests" },
    { id: "1b", name: "Wire generator into brand authoring + editor", status: "done", detail: "<code>3f3b19d</code>" },
    { id: "2",  name: "Live, direct-DOM preview in the editor", status: "done", detail: "<code>aa60b5c</code>" },
    { id: "3",  name: "Shared hover/press/focus state primitive", status: "done", detail: "<code>40d2fdd</code>" },
    { id: "4",  name: "Dark/light theme switcher", status: "todo", detail: "Not started — independent, only end-user-visible task left" },
    { id: "5a", name: "Brand inheritance: parent resolution + merge", status: "done", detail: "<code>1ddd888</code>" },
    { id: "5b", name: "Brand inheritance: reset-to-parent", status: "done", detail: "<code>5acd34f</code>" },
    { id: "5c", name: "Inherited vs. overridden editor UI", status: "progress", detail: "Spec ready (<code>7944639</code>), full inherited-field-editing support — awaiting execution" },
    { id: "6",  name: "Token orphan-detection test", status: "done", detail: "<code>c2f3733</code> · live gate on every token-touching task" },
    { id: "7",  name: "Per-component sidebar navigation", status: "done", detail: "<code>3f6789b</code> + bugfix rounds <code>842fe89</code>/<code>cfe4c3c</code>" },
    { id: "8a", name: "Batch-write logic + route action", status: "done", detail: "<code>134e40d</code>" },
    { id: "8b", name: "Pending edits, scope choice, explicit Save", status: "done", detail: "<code>650310a</code> + follow-ups <code>4884412</code> · Playwright: 10 passed, 1 fixme" },
    { id: "9",  name: "Per-token descriptions, manually saved", status: "todo", detail: "Spec ready (<code>1d1d61a</code>), not yet handed off" },
  ];

  const statusLabel = { done: "Done", progress: "In progress", todo: "Not started" };
  const list = document.getElementById("tasks");
  for (const t of tasks) {
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="task-id">${t.id}</span>
      <span class="task-body">
        <div class="task-name">${t.name}</div>
        <div class="task-detail">${t.detail}</div>
      </span>
      <span class="status ${t.status}">${statusLabel[t.status]}</span>
    `;
    list.appendChild(li);
  }
</script>
</body>
</html>
