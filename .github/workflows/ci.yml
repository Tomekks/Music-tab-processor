name: app

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Inert placeholders, never real credentials. next build constructs the
      # libSQL client at module load during page-data collection
      # (app/db/client.ts), so it needs a syntactically valid URL -- but the
      # route is force-dynamic, so no query ever executes at build time and
      # these values never make a real connection. Verified locally: full
      # `npm run verify:full` passes with exactly these values and no
      # TURSO_* secrets configured.
      TURSO_DATABASE_URL: "libsql://ci-placeholder"
      TURSO_AUTH_TOKEN: "ci-placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # .nvmrc (repo root) is the project's Node pin -- CI runs what
          # developers run (satisfies app/package.json engines >=22).
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run verify:full

  e2e-design-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same pin/cache convention as the verify job above.
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No TURSO_* placeholders needed here (unlike verify above): this runs
      # `next dev`, not a production build, against /design-system only — a
      # route that never imports the db client.
      - run: npm run test:e2e:design-system
